name: Release design system package

# Publishes sebenarnya-design-system-X.Y.Z.tgz (X.Y.Z = design-system/package.json "version")
# as a GitHub Release asset under the tag ds-vX.Y.Z. Products install it by URL:
#   npm install https://github.com/DM3F/sebenarnya.my/releases/download/ds-vX.Y.Z/sebenarnya-design-system-X.Y.Z.tgz
#
# Two ways to release:
#   - Actions tab → "Release design system package" → Run workflow (branch: main).
#     The workflow creates the tag ds-vX.Y.Z on the commit it ran on.
#   - Or push a tag ds-vX.Y.Z yourself (it must match the package version).
on:
  workflow_dispatch:
  push:
    tags: ["ds-v*"]

permissions:
  contents: write

concurrency:
  group: design-system-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Work out the version and tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./design-system/package.json').version")
          TAG="ds-v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
              echo "::error::Run this workflow on main (you picked ${GITHUB_REF_NAME})." >&2
              exit 1
            fi
            if gh release view "${TAG}" >/dev/null 2>&1; then
              echo "::error::${TAG} is already released. Bump \"version\" in design-system/package.json, merge it to main, then run this again." >&2
              exit 1
            fi
          elif [ "${GITHUB_REF_NAME}" != "${TAG}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match design-system/package.json version ${VERSION}." >&2
            exit 1
          fi
          echo "Releasing ${TAG}"

      - name: Install dependencies
        run: npm ci

      - name: Lint the design system
        run: npm run lint:ds

      - name: Build the package
        run: npm run build:ds

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # --target creates the tag on this commit when it does not exist yet (Run workflow)
          gh release create "${TAG}" "design-system/sebenarnya-design-system-${VERSION}.tgz" \
            --target "${GITHUB_SHA}" \
            --title "Design system ${VERSION}" \
            --notes "Install: npm install https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/sebenarnya-design-system-${VERSION}.tgz"
